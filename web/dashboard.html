<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Dental | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
    
    <aside class="sidebar panel">
        <div class="sidebar-header">
            <h2>&#9728; Sunrise Dental</h2>
        </div>
        
        <div class="user-profile">
            <div class="avatar"></div>
            <div class="user-info">
                <p id="sidebarUserName" class="name">Loading...</p>
                <p id="sidebarUserRole" class="role">Staff</p>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item active">Dashboard</a>
            <a href="patients.html" class="nav-item">Patients</a>
            <a href="appointments.html" class="nav-item">Appointments</a>
            <a href="billing.html" class="nav-item" id="navBilling">Billing</a>
            <a href="reports.html" class="nav-item" id="navReports">Reports</a>
            <a href="admin.html" class="nav-item" id="navAdmin">&#x2699; Admin Panel</a>
            <a href="help.html" class="nav-item">Help Guide</a>
        </nav>
        
        <div class="sidebar-footer">
            <a href="#" id="logoutBtn" class="logout-link">Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1>Dashboard Overview</h1>
            <div class="date-display" id="currentDate"></div>
        </header>

        <div class="dashboard-grid">
            <div class="stat-card panel">
                <h3>Today's Appointments</h3>
                <p class="stat-value" id="statAppointments">--</p>
            </div>
            
            <div class="stat-card panel">
                <h3>Completed</h3>
                <p class="stat-value text-success" id="statCompleted">--</p>
            </div>
            
            <div class="stat-card panel" id="revenueCard">
                <h3>Revenue Today</h3>
                <p class="stat-value text-primary" id="statRevenue">Rs. --</p>
            </div>
        </div>

        <div class="content-section panel mt-4">
            <h2>Upcoming Appointments (Today)</h2>
            <div class="table-responsive">
                <table class="data-table" id="todayApptsTable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Patient</th>
                            <th>Dentist</th>
                            <th>Treatment</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="todayApptsBody">
                        <tr><td colspan="5" class="text-center">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupDashboardLayout();
            
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const dateStr = `${yyyy}-${mm}-${dd}`;
            
            document.getElementById('currentDate').textContent = today.toLocaleDateString('en-GB', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
            
            loadDashboardData(dateStr);
        });

        async function loadDashboardData(dateStr) {
            try {
                const apptRes = await fetch('api/appointments?date=' + dateStr);
                const billRes = await fetch('api/billing?date=' + dateStr);
                
                let appts = [];
                let bills = [];
                
                if(apptRes.ok) appts = await apptRes.json();
                if(billRes.ok) bills = await billRes.json();
                
                let completedCount = 0;
                appts.forEach(a => {
                    if (a.status === 'COMPLETED') completedCount++;
                });
                
                let revenue = 0;
                bills.forEach(b => {
                    if (b.status === 'PAID') revenue += b.totalAmount;
                });
                
                document.getElementById('statAppointments').textContent = appts.length;
                document.getElementById('statCompleted').textContent = completedCount;
                document.getElementById('statRevenue').textContent = formatCurrency(revenue);
                
                const tbody = document.getElementById('todayApptsBody');
                if (appts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No appointments scheduled for today.</td></tr>';
                } else {
                    const rows = appts.map(a => {
                        const badgeClass = a.status === 'COMPLETED' ? 'success' : (a.status === 'CANCELLED' || a.status === 'NO_SHOW' ? 'danger' : 'warning');
                        return `
                            <tr>
                                <td>${a.time}</td>
                                <td>${escHtml(a.patientName)}</td>
                                <td>${escHtml(a.dentistName)}</td>
                                <td>${escHtml(a.treatment)}</td>
                                <td><span class="badge ${badgeClass}">${a.status}</span></td>
                            </tr>
                        `;
                    }).join('');
                    tbody.innerHTML = rows;
                }

            } catch (e) {
                console.log('Error loading data', e);
                document.getElementById('todayApptsBody').innerHTML = '<tr><td colspan="5" class="text-center">Error loading dashboard data.</td></tr>';
            }
        }
        
        function escHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
    </script>
</body>
</html>
