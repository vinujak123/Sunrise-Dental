<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Dental | Billing</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
    
    <aside class="sidebar panel">
        <div class="sidebar-header">
            <h2>&#9728; Sunrise Dental</h2>
        </div>
        <div class="user-profile">
            <div class="avatar"></div>
            <div class="user-info">
                <p id="sidebarUserName" class="name">Loading...</p>
                <p id="sidebarUserRole" class="role">Staff</p>
            </div>
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="patients.html" class="nav-item">Patients</a>
            <a href="appointments.html" class="nav-item">Appointments</a>
            <a href="billing.html" class="nav-item active" id="navBilling">Billing</a>
            <a href="reports.html" class="nav-item" id="navReports">Reports</a>
            <a href="admin.html" class="nav-item" id="navAdmin">&#x2699; Admin Panel</a>
            <a href="help.html" class="nav-item">Help Guide</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" id="logoutBtn" class="logout-link">Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1>Billing & Invoicing</h1>
            <button class="btn-primary" onclick="toggleBillModal()">+ Generate Bill</button>
        </header>

        <div class="content-section panel">
            <div class="dashboard-form single-col" style="margin-bottom: 20px;">
                <div class="input-group" style="width: 250px;">
                    <label>Filter Date</label>
                    <input type="date" id="filterDate" onchange="loadBills()">
                </div>
            </div>

            <div class="table-responsive">
                <table class="data-table" id="billsTable">
                    <thead>
                        <tr>
                            <th>Bill Number</th>
                            <th>Appt Number</th>
                            <th>Patient Name</th>
                            <th>Total Amount</th>
                            <th>Method</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="billsBody">
                        <tr><td colspan="7" class="text-center">Loading bills...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Generate Bill Modal -->
    <div id="billModal" class="hidden modal-overlay">
        <div class="modal-box" style="max-width: 500px;">
            <h2>Generate Bill</h2>
            <form id="billForm" class="dashboard-form mt-4 single-col">
                <input type="hidden" name="action" value="generate">
                <div class="input-group">
                    <label>Appointment ID</label>
                    <input type="number" name="apptId" required placeholder="Enter Appt ID">
                </div>
                <div class="input-group">
                    <label>Consultation Fee (Rs.)</label>
                    <input type="number" step="0.01" name="consultationFee" value="500.00">
                </div>
                <div class="input-group">
                    <label>Discount (%)</label>
                    <input type="number" step="0.01" name="discountPercent" value="0.00">
                </div>
                <div class="input-group">
                    <label>Payment Method</label>
                    <select name="paymentMethod">
                        <option value="CASH">Cash</option>
                        <option value="CARD">Card</option>
                        <option value="INSURANCE">Insurance</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="toggleBillModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Generate</button>
                </div>
            </form>
            <div id="billMsg" style="margin-top: 15px; display: none;"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupDashboardLayout();
            document.getElementById('filterDate').valueAsDate = new Date();
            loadBills();
            document.getElementById('billForm').addEventListener('submit', handleBilling);
        });

        function toggleBillModal() {
            document.getElementById('billModal').classList.toggle('hidden');
        }

        async function loadBills() {
            const date = document.getElementById('filterDate').value;
            const tbody = document.getElementById('billsBody');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">Loading...</td></tr>';
            
            try {
                const response = await fetch('api/billing?date=' + date);
                if(response.ok) {
                    const data = await response.json();
                    renderTable(data);
                } else {
                    renderTable([]);
                }
            } catch(e) {
                renderTable([]);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('billsBody');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">No bills found for this date.</td></tr>';
                return;
            }
            
            const rows = data.map(b => {
                const badgeClass = b.status === 'PAID' ? 'success' : 'warning';
                let actionLink = b.status === 'PENDING' 
                    ? `<button class="btn-sm btn-primary" onclick="markPaid(${b.id})">Mark Paid</button>`
                    : `<button class="btn-sm btn-secondary" onclick="window.print()">Print</button>`;
                return `
                    <tr>
                        <td>${b.billNumber}</td>
                        <td>${b.apptNumber || '—'}</td>
                        <td>${escHtml(b.patientName)}</td>
                        <td>${formatCurrency(b.totalAmount)}</td>
                        <td>${b.method}</td>
                        <td><span class="badge ${badgeClass}">${b.status}</span></td>
                        <td>${actionLink}</td>
                    </tr>
                `;
            }).join('');
            tbody.innerHTML = rows;
        }

        async function handleBilling(e) {
            e.preventDefault();
            const form = e.target;
            const data = new URLSearchParams(new FormData(form));
            const msgBox = document.getElementById('billMsg');
            
            try {
                const response = await fetch('api/billing', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: data
                });
                const result = await response.json();
                msgBox.style.display = 'block';
                if(result.status === 'success') {
                    msgBox.innerHTML = `<span class="text-success">${result.message}</span>`;
                    showToast('Bill generated!', 'success');
                    setTimeout(() => { toggleBillModal(); loadBills(); form.reset(); msgBox.style.display = 'none'; }, 1500);
                } else {
                    msgBox.innerHTML = `<span class="error-msg">${result.message}</span>`;
                }
            } catch(e) {
                msgBox.style.display = 'block';
                msgBox.innerHTML = `<span class="error-msg">Server error</span>`;
            }
        }

        async function markPaid(billId) {
            if(!confirm('Mark this bill as paid?')) return;
            const data = new URLSearchParams();
            data.append('action', 'pay');
            data.append('billId', billId);
            
            try {
                const response = await fetch('api/billing', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: data
                });
                const result = await response.json();
                if(result.status === 'success') {
                    showToast('Payment recorded!', 'success');
                    loadBills();
                } else {
                    showToast(result.message || 'Failed to record payment', 'error');
                }
            } catch(e) { 
                showToast('Server error', 'error');
            }
        }

        function escHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
    </script>
</body>
</html>
